name: Update Sheet Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Fetch Sheet data
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, datetime

          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          sa_key = json.loads(os.environ['GOOGLE_SA_KEY'])
          creds = service_account.Credentials.from_service_account_info(
              sa_key,
              scopes=['https://www.googleapis.com/auth/spreadsheets.readonly']
          )

          service = build('sheets', 'v4', credentials=creds)
          SHEET_ID = '1GXpt3RSo538eEbUTlWq4gIYiyD5pSj-ZJGApwkYoTYc'

          def g(row, idx, default=''):
              try: return row[idx].strip() if len(row) > idx and row[idx] else default
              except: return default

          # ── STEP 1: Build PLACA → CICLO lookup from all non-Assignments tabs ──
          spreadsheet_meta = service.spreadsheets().get(spreadsheetId=SHEET_ID).execute()
          all_sheets = [s['properties']['title'] for s in spreadsheet_meta.get('sheets', [])]
          print(f"Tabs found: {all_sheets}")

          placa_ciclo = {}
          for sheet_name in all_sheets:
              if sheet_name == 'Assignments':
                  continue
              try:
                  res = service.spreadsheets().values().get(
                      spreadsheetId=SHEET_ID,
                      range=f"'{sheet_name}'!A1:P500",
                      majorDimension='ROWS'
                  ).execute()
                  rows = res.get('values', [])
                  # Find header row containing PLACA (or PATENTE) and CICLO
                  for i, row in enumerate(rows):
                      row_up = [c.strip().upper() for c in row]
                      placa_col = next((j for j, h in enumerate(row_up) if h in ('PLACA','PATENTE')), None)
                      ciclo_col = next((j for j, h in enumerate(row_up) if h == 'CICLO'), None)
                      if placa_col is not None and ciclo_col is not None:
                          for data_row in rows[i+1:]:
                              placa = g(data_row, placa_col).upper()
                              ciclo = g(data_row, ciclo_col).upper()
                              if placa and ciclo and placa not in placa_ciclo:
                                  placa_ciclo[placa] = ciclo
                          print(f"  {sheet_name}: found {len(placa_ciclo)} plates so far")
                          break
              except Exception as e:
                  print(f"  {sheet_name}: skipped ({e})")

          print(f"CICLO lookup built: {len(placa_ciclo)} plates")

          # ── STEP 2: Read Assignments tab ──
          result = service.spreadsheets().values().get(
              spreadsheetId=SHEET_ID,
              range="'Assignments'!A1:I2000",
              majorDimension='ROWS'
          ).execute()
          rows = result.get('values', [])

          def find_header(rows):
              for i, row in enumerate(rows):
                  if 'PATENTE' in row or 'MUELLE' in row:
                      return {v.strip(): j for j, v in enumerate(row)}, i
              return {}, -1

          h, header_row = find_header(rows)
          scheduled = []
          seen = set()

          for row in rows[header_row+1:]:
              patente = g(row, h.get('PATENTE', 3)).upper()
              muelle  = g(row, h.get('MUELLE', 4)).upper()
              ola     = g(row, h.get('OLA', 5))
              ruta    = g(row, h.get('Ruta', 6))
              svc     = g(row, h.get('FACILITY_ID', 0))
              route   = g(row, h.get('ROUTE_NAME', 2))
              if not patente or patente in ('PATENTE',): continue
              key = patente + muelle + ola
              if key in seen: continue
              seen.add(key)
              ciclo = placa_ciclo.get(patente, '')
              scheduled.append({
                  'placa': patente,
                  'station': muelle,
                  'ola': ola,
                  'ciclo': ciclo,
                  'svc': svc,
                  'ruta': ruta,
                  'route': route,
                  'hora': '',
              })

          data = {
              'updated': datetime.datetime.utcnow().isoformat() + 'Z',
              'scheduled': scheduled,
              'registry': []
          }

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)

          am  = sum(1 for d in scheduled if d['ciclo']=='AM')
          amt = sum(1 for d in scheduled if d['ciclo']=='AMT')
          pm  = sum(1 for d in scheduled if d['ciclo']=='PM')
          sin = sum(1 for d in scheduled if not d['ciclo'])
          print(f"OK: {len(scheduled)} conductores — AM:{am} AMT:{amt} PM:{pm} sin_ciclo:{sin}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update data.json [skip ci]"
          git push
