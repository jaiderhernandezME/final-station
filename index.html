<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFE600" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Station Place" />
  <link rel="manifest" href="./manifest.json" />
  <title>Station Place</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --yellow:#FFE600;--dark:#1A1A1A;--gray:#F5F5F5;--border:#E0E0E0;--text:#333;--muted:#777;--green:#00A650;--orange:#FF7733;--blue:#3483FA;--red:#F23D4F; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray);color:var(--text);min-height:100vh; }

    header { background:var(--yellow);padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12); }
    .header-top { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
    .header-brand { display:flex;align-items:center;gap:10px; }
    .ml-logo { height:22px;width:auto;display:block; }
    .header-divider { width:1.5px;height:20px;background:rgba(0,0,0,.25);border-radius:2px; }
    header h1 { font-size:17px;font-weight:900;color:var(--dark);letter-spacing:-.3px; }
    .refresh-btn { background:var(--dark);color:var(--yellow);border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer; }
    .refresh-btn.loading .icon { animation:spin 1s linear infinite;display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .search-wrap { position:relative; }
    .search-wrap input { width:100%;padding:10px 40px 10px 38px;border-radius:10px;border:2px solid transparent;background:white;font-size:16px;font-weight:500;color:var(--dark);outline:none;text-transform:uppercase;letter-spacing:1px;transition:border-color .2s; }
    .search-wrap input:focus { border-color:var(--dark); }
    .search-wrap .icon-search { position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none; }
    .search-wrap .clear-btn { position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#ccc;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;color:white;font-weight:700; }
    .search-wrap.has-text .clear-btn { display:flex; }

    .status-bar { background:white;padding:8px 16px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border); }
    .status-dot { width:8px;height:8px;border-radius:50%;background:#ccc;flex-shrink:0; }
    .status-dot.ok { background:var(--green); }
    .status-dot.error { background:var(--red); }
    .status-dot.loading { background:var(--orange);animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

    .tabs { display:flex;background:white;border-bottom:2px solid var(--border);position:sticky;top:110px;z-index:90; }
    .tab { flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;user-select:none; }
    .tab.active { color:var(--dark);border-bottom-color:var(--dark); }

    .content { padding:12px 12px 80px; }

    .result-card { background:white;border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-left:5px solid var(--yellow); }
    .result-card.not-found { border-left-color:var(--red);text-align:center;color:var(--muted); }
    .result-plate { font-size:28px;font-weight:900;letter-spacing:3px;color:var(--dark);margin-bottom:14px; }
    .result-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
    .result-item { background:var(--gray);border-radius:10px;padding:12px; }
    .result-item .label { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px; }
    .result-item .value { font-size:20px;font-weight:800;color:var(--dark); }
    .result-item.full { grid-column:1/-1; }
    .ola-badge { display:inline-block;background:var(--blue);color:white;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:700; }
    .ola-badge.reserva { background:var(--orange); }

    .section-title { font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 8px;padding-left:4px; }
    .driver-card { background:white;border-radius:12px;padding:14px 16px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .1s; }
    .driver-card:active { transform:scale(.98); }
    .driver-plate { font-size:18px;font-weight:800;letter-spacing:1.5px;color:var(--dark); }
    .driver-meta { font-size:12px;color:var(--muted);margin-top:2px; }
    .driver-meta span { margin-right:8px; }
    .driver-right { text-align:right; }
    .driver-station { font-size:22px;font-weight:900;color:var(--dark); }
    .driver-ola { font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase; }
    .ciclo-chip { display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--gray);color:var(--muted);margin-right:4px; }
    .ciclo-chip.AM { background:#FFF3CD;color:#856404; }
    .ciclo-chip.PM { background:#CCE5FF;color:#004085; }
    .ciclo-chip.AMT { background:#D4EDDA;color:#155724; }

    .empty-state { text-align:center;padding:48px 24px;color:var(--muted); }
    .empty-state .emoji { font-size:48px;margin-bottom:12px; }
    .skeleton { background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px;height:60px;margin-bottom:8px; }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    mark { background:var(--yellow);border-radius:2px;padding:0 2px; }

    /* ── SAVE BUTTON ── */
    .save-btn {
      display:block; width:100%; margin-top:14px;
      background:var(--green); color:white; border:none; border-radius:10px;
      padding:12px; font-size:15px; font-weight:700; cursor:pointer;
      transition:opacity .2s;
    }
    .save-btn:active { opacity:.8; }

    /* ── SAVED LIST ── */
    #saved-panel {
      position:fixed; bottom:0; left:0; right:0; background:white;
      border-top:2px solid var(--border); z-index:150;
      max-height:45vh; overflow-y:auto;
      transform:translateY(100%); transition:transform .3s;
    }
    #saved-panel.open { transform:translateY(0); }
    .saved-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; background:var(--dark); color:white; position:sticky; top:0;
    }
    .saved-header h3 { font-size:14px; font-weight:700; }
    .saved-clear { background:none; border:none; color:#aaa; font-size:13px; cursor:pointer; }
    .saved-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer;
    }
    .saved-item:active { background:var(--gray); }
    .saved-plate { font-size:17px; font-weight:800; letter-spacing:1px; }
    .saved-info { font-size:12px; color:var(--muted); margin-top:2px; }
    .saved-station { font-size:20px; font-weight:900; color:var(--dark); }
    .saved-del { background:none; border:none; color:var(--red); font-size:18px; cursor:pointer; padding:4px 8px; }

    .fab-saved {
      position:fixed; bottom:20px; right:20px; background:var(--dark); color:var(--yellow);
      border:none; border-radius:50%; width:52px; height:52px; font-size:20px;
      cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:140;
      display:flex; align-items:center; justify-content:center;
    }
    .fab-badge {
      position:absolute; top:-4px; right:-4px; background:var(--red); color:white;
      border-radius:50%; width:18px; height:18px; font-size:10px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
    }
    /* ── SYNC BUTTON ── */
    .fab-sync {
      position:fixed; bottom:20px; left:20px;
      background:var(--blue); color:white;
      border:none; border-radius:24px;
      padding:12px 18px; font-size:14px; font-weight:700;
      cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:140;
      display:flex; align-items:center; gap:8px;
      text-decoration:none;
    }
    .fab-sync:active { opacity:.8; }

    .updated-note { font-size:11px;color:var(--muted);text-align:center;padding:8px;background:white;border-top:1px solid var(--border); }
  </style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="header-brand">
      <img class="ml-logo"
           src="https://http2.mlstatic.com/frontend-assets/ui-navigation/5.21.22/mercadolibre/logo__large_plus.png"
           alt="MercadoLibre"
           onerror="this.style.display='none'"/>
      <div class="header-divider"></div>
      <h1>Station Place</h1>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()"><span class="icon">↻</span> Actualizar</button>
  </div>
  <div class="search-wrap" id="searchWrap">
    <span class="icon-search">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar placa... (ej: KMK727)" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="10" />
    <button class="clear-btn" onclick="clearSearch()">✕</button>
  </div>
</header>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Cargando datos...</span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="todos" onclick="switchTab('todos')">📋 Todos</div>
  <div class="tab" data-tab="AM" onclick="switchTab('AM')">🌅 AM</div>
  <div class="tab" data-tab="AMT" onclick="switchTab('AMT')">🌄 AMT</div>
  <div class="tab" data-tab="PM" onclick="switchTab('PM')">🌆 PM</div>
  <div class="tab" data-tab="registro" onclick="switchTab('registro')">📁 Registro</div>
</div>

<div class="content" id="content">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</div>

<!-- SYNC BUTTON -->
<a class="fab-sync" href="./sync.html">
  🔄 Actualizar Sheet
</a>

<!-- FAB guardadas -->
<button class="fab-saved" id="fabSaved" onclick="toggleSaved()" style="display:none">
  📋<span class="fab-badge" id="savedBadge">0</span>
</button>

<!-- Panel de placas guardadas -->
<div id="saved-panel">
  <div class="saved-header">
    <h3>📋 Placas guardadas</h3>
    <button class="saved-clear" onclick="clearAllSaved()">Borrar todo</button>
  </div>
  <div id="saved-list"></div>
</div>

<script>
const DATA_URL = './data.json';
const REFRESH_MS = 60 * 1000;

let allScheduled = [], allRegistry = [], updatedAt = '';
let currentTab = 'todos', searchQuery = '', refreshTimer = null;

async function loadData() {
  setStatus('loading', 'Cargando...');
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  try {
    const resp = await fetch(DATA_URL + '?_=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    allScheduled = data.scheduled || [];
    allRegistry  = data.registry  || [];
    updatedAt    = data.updated   || '';
    const t = updatedAt ? new Date(updatedAt).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '';
    setStatus('ok', 'Datos al ' + (t ? t : '—'));
  } catch(e) {
    setStatus('error', 'Sin conexión');
  }
  btn.classList.remove('loading');
  render();
}

function render() {
  const q = searchQuery.toUpperCase().trim();
  const content = document.getElementById('content');
  if (q.length >= 2) { renderSearch(q, content); return; }
  if (currentTab === 'registro') { renderRegistry(content); return; }

  let drivers = allScheduled;
  if (currentTab === 'AM')  drivers = drivers.filter(d => d.ciclo==='AM');
  if (currentTab === 'AMT') drivers = drivers.filter(d => d.ciclo==='AMT');
  if (currentTab === 'PM')  drivers = drivers.filter(d => d.ciclo==='PM');

  if (!drivers.length) { content.innerHTML = emptyState('Sin conductores','No hay conductores en este turno.'); return; }

  const groups = {};
  drivers.forEach(d => { const k=d.ciclo||'—'; if(!groups[k]) groups[k]=[]; groups[k].push(d); });
  let html = '';
  Object.keys(groups).sort().forEach(c => {
    const list = groups[c].sort((a,b)=>a.hora.localeCompare(b.hora));
    html += `<div class="section-title">${c} · ${list.length} conductores</div>`;
    list.forEach(d => { html += driverCard(d,''); });
  });
  content.innerHTML = html;
}

function renderSearch(q, content) {
  const inSched = allScheduled.filter(d=>d.placa.includes(q));
  const inReg   = allRegistry.filter(d=>d.placa.includes(q));
  if (!inSched.length && !inReg.length) {
    content.innerHTML=`<div class="result-card not-found"><div style="font-size:40px;margin-bottom:8px">🔍</div><p>Placa <strong>${q}</strong> no encontrada</p></div>`;
    return;
  }
  let html='';
  if (inSched.length) {
    html += `<div class="section-title">Programados (${inSched.length})</div>`;
    inSched.forEach(d => {
      html += `<div class="result-card">
        <div class="result-plate">${highlight(d.placa,q)}</div>
        <div class="result-grid">
          <div class="result-item"><div class="label">Muelle / Station</div><div class="value">${d.station||'—'}</div></div>
          <div class="result-item"><div class="label">Ola</div><div class="value"><span class="ola-badge ${d.station==='RESERVA'?'reserva':''}">${d.ola||'—'}</span></div></div>
          <div class="result-item"><div class="label">Hora ETA</div><div class="value" style="font-size:16px">${d.hora||'—'}</div></div>
          <div class="result-item"><div class="label">Ciclo</div><div class="value" style="font-size:16px"><span class="ciclo-chip ${d.ciclo}">${d.ciclo}</span></div></div>
          ${d.svc?`<div class="result-item full"><div class="label">Servicio</div><div class="value" style="font-size:14px">${d.svc}</div></div>`:''}
        </div>
        <button class="save-btn" onclick="savePlate(${JSON.stringify(d).replace(/"/g,'&quot;')})">
          📋 Guardar y buscar otra
        </button>
      </div>`;
    });
  }
  if (inReg.length) {
    html += `<div class="section-title">Registro (${inReg.length})</div>`;
    inReg.forEach(d => {
      html += `<div class="driver-card"><div><div class="driver-plate">${highlight(d.placa,q)}</div><div class="driver-meta"><span>${d.cat||'—'}</span></div></div><div class="driver-right"><div class="driver-station">${d.station||'—'}</div><div class="driver-ola">Ola ${d.ola||'—'}</div></div></div>`;
    });
  }
  content.innerHTML = html;
}

function renderRegistry(content) {
  if (!allRegistry.length) { content.innerHTML=emptyState('Sin registros','No hay datos en el registro.'); return; }
  const groups={};
  allRegistry.forEach(d => { const k=d.ola||'—'; if(!groups[k]) groups[k]=[]; groups[k].push(d); });
  let html='';
  Object.keys(groups).sort().forEach(ola => {
    html += `<div class="section-title">Ola ${ola} · ${groups[ola].length} placas</div>`;
    groups[ola].forEach(d => {
      html += `<div class="driver-card"><div><div class="driver-plate">${d.placa}</div><div class="driver-meta"><span>${d.cat||'ANTIGUO'}</span></div></div><div class="driver-right"><div class="driver-station">${d.station||'—'}</div><div class="driver-ola">Ola ${d.ola||'—'}</div></div></div>`;
    });
  });
  content.innerHTML = html;
}

function driverCard(d,q) {
  const plate=q?highlight(d.placa,q):d.placa;
  return `<div class="driver-card" onclick="searchByPlate('${d.placa}')">
    <div><div class="driver-plate">${plate}</div><div class="driver-meta"><span class="ciclo-chip ${d.ciclo}">${d.ciclo}</span><span>${d.hora}</span><span>${d.svc}</span></div></div>
    <div class="driver-right"><div class="driver-station">${d.station||'—'}</div><div class="driver-ola">Ola ${d.ola||'—'}</div></div>
  </div>`;
}

function highlight(text,q) { return text.replace(new RegExp(q,'gi'),m=>`<mark>${m}</mark>`); }
function emptyState(title,msg) { return `<div class="empty-state"><div class="emoji">📭</div><p><strong>${title}</strong><br>${msg}</p></div>`; }
function setStatus(state,msg) { document.getElementById('statusDot').className='status-dot '+state; document.getElementById('statusText').textContent=msg; }

function switchTab(tab) {
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  clearSearch(); render();
}
function clearSearch() {
  searchQuery=''; document.getElementById('searchInput').value='';
  document.getElementById('searchWrap').classList.remove('has-text'); render();
}
function searchByPlate(placa) {
  document.getElementById('searchInput').value=placa; searchQuery=placa;
  document.getElementById('searchWrap').classList.add('has-text'); render();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('searchInput').addEventListener('input',function(){
  searchQuery=this.value.toUpperCase().trim();
  document.getElementById('searchWrap').classList.toggle('has-text',searchQuery.length>0);
  render();
});

// ── SAVED PLATES ─────────────────────────────────────────────────────────
let savedPlates = JSON.parse(localStorage.getItem('savedPlates') || '[]');

function savePlate(data) {
  // Remove existing entry for same plate
  savedPlates = savedPlates.filter(p => p.placa !== data.placa);
  savedPlates.unshift(data);
  localStorage.setItem('savedPlates', JSON.stringify(savedPlates));
  updateSavedUI();
  // Clear search and show confirmation
  clearSearch();
  showToast(`✅ ${data.placa} guardada`);
}

function deleteSaved(placa) {
  savedPlates = savedPlates.filter(p => p.placa !== placa);
  localStorage.setItem('savedPlates', JSON.stringify(savedPlates));
  updateSavedUI();
}

function clearAllSaved() {
  savedPlates = [];
  localStorage.setItem('savedPlates', '[]');
  updateSavedUI();
}

function toggleSaved() {
  document.getElementById('saved-panel').classList.toggle('open');
}

function updateSavedUI() {
  const fab = document.getElementById('fabSaved');
  const badge = document.getElementById('savedBadge');
  const list = document.getElementById('saved-list');

  if (savedPlates.length > 0) {
    fab.style.display = 'flex';
    badge.textContent = savedPlates.length;
    list.innerHTML = savedPlates.map(p => `
      <div class="saved-item" onclick="searchByPlate('${p.placa}');toggleSaved()">
        <div>
          <div class="saved-plate">${p.placa}</div>
          <div class="saved-info">${p.station||'—'} · Ola ${p.ola||'—'} · ${p.hora||''} ${p.ciclo||''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="saved-station">${p.station||'—'}</div>
          <button class="saved-del" onclick="event.stopPropagation();deleteSaved('${p.placa}')">×</button>
        </div>
      </div>`).join('');
  } else {
    fab.style.display = 'none';
    document.getElementById('saved-panel').classList.remove('open');
    list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted)">No hay placas guardadas</div>';
  }
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:300;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeo
