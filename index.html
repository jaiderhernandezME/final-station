<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFE600" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Final Station" />
  <link rel="manifest" href="./manifest.json" />
  <title>Final Station – Conductores</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FFE600;
      --dark: #1A1A1A;
      --gray: #F5F5F5;
      --border: #E0E0E0;
      --text: #333;
      --muted: #777;
      --green: #00A650;
      --orange: #FF7733;
      --blue: #3483FA;
      --red: #F23D4F;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      background: var(--yellow);
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.3px;
    }
    .refresh-btn {
      background: var(--dark);
      color: var(--yellow);
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.2s;
    }
    .refresh-btn:active { opacity: 0.7; }
    .refresh-btn.loading .icon { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SEARCH ── */
    .search-wrap {
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 40px 10px 38px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: white;
      font-size: 16px;
      font-weight: 500;
      color: var(--dark);
      outline: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--dark); }
    .search-wrap .icon-search {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }
    .search-wrap .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #ccc;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 13px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }
    .search-wrap.has-text .clear-btn { display: flex; }

    /* ── STATUS BAR ── */
    .status-bar {
      background: white;
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--green); }
    .status-dot.error { background: var(--red); }
    .status-dot.loading { background: var(--orange); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: white;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 110px;
      z-index: 90;
    }
    .tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }
    .tab.active {
      color: var(--dark);
      border-bottom-color: var(--dark);
    }

    /* ── CONTENT ── */
    .content { padding: 12px 12px 80px; }

    /* ── SEARCH RESULT ── */
    .result-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      border-left: 5px solid var(--yellow);
    }
    .result-card.not-found {
      border-left-color: var(--red);
      text-align: center;
      color: var(--muted);
    }
    .result-plate {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--dark);
      margin-bottom: 14px;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .result-item {
      background: var(--gray);
      border-radius: 10px;
      padding: 12px;
    }
    .result-item .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .result-item .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--dark);
    }
    .result-item.full { grid-column: 1 / -1; }

    /* Badge para ola */
    .ola-badge {
      display: inline-block;
      background: var(--blue);
      color: white;
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .ola-badge.reserva { background: var(--orange); }

    /* ── DRIVER ROWS ── */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin: 16px 0 8px;
      padding-left: 4px;
    }

    .driver-card {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .driver-card:active { transform: scale(0.98); }

    .driver-plate {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--dark);
    }
    .driver-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .driver-meta span { margin-right: 8px; }

    .driver-right {
      text-align: right;
    }
    .driver-station {
      font-size: 22px;
      font-weight: 900;
      color: var(--dark);
    }
    .driver-ola {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Chip de ciclo */
    .ciclo-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--gray);
      color: var(--muted);
      margin-right: 4px;
    }
    .ciclo-chip.AM { background: #FFF3CD; color: #856404; }
    .ciclo-chip.PM { background: #CCE5FF; color: #004085; }
    .ciclo-chip.AMT { background: #D4EDDA; color: #155724; }

    /* ── EMPTY / SKELETON ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; line-height: 1.5; }

    .skeleton {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 8px;
      height: 60px;
      margin-bottom: 8px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── INSTALL BANNER ── */
    #install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--dark);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 200;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.2);
    }
    #install-banner p { font-size: 13px; line-height: 1.3; }
    #install-banner p strong { display: block; font-size: 14px; margin-bottom: 2px; }
    .install-btn {
      background: var(--yellow);
      color: var(--dark);
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .dismiss-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }

    /* ── HIGHLIGHT ── */
    mark { background: var(--yellow); border-radius: 2px; padding: 0 2px; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🚚 Final Station</h1>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
      <span class="icon">↻</span> Actualizar
    </button>
  </div>
  <div class="search-wrap" id="searchWrap">
    <span class="icon-search">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar placa... (ej: KMK727)"
      autocomplete="off" autocorrect="off" spellcheck="false" maxlength="10" />
    <button class="clear-btn" onclick="clearSearch()">✕</button>
  </div>
</header>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Cargando datos...</span>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="todos" onclick="switchTab('todos')">📋 Todos</div>
  <div class="tab" data-tab="AM" onclick="switchTab('AM')">🌅 AM</div>
  <div class="tab" data-tab="PM" onclick="switchTab('PM')">🌆 PM</div>
  <div class="tab" data-tab="registro" onclick="switchTab('registro')">📁 Registro</div>
</div>

<div class="content" id="content">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<div id="install-banner" style="display:none">
  <p><strong>Instalar app</strong>Agrega al inicio para acceso rápido</p>
  <button class="install-btn" id="installBtn">Instalar</button>
  <button class="dismiss-btn" onclick="dismissInstall()">✕</button>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const SHEET_ID   = '1GXpt3RSo538eEbUTlWq4gIYiyD5pSj-ZJGApwkYoTYc';
const SHEET_GID  = '1553759742';
const CSV_URL    = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;
const REFRESH_MS = 60 * 1000; // auto-refresh cada 60s

// ── STATE ────────────────────────────────────────────────────────────────────
let allScheduled = [];   // conductores programados (tabla 1)
let allRegistry  = [];   // registro de placas (tabla 2)
let currentTab   = 'todos';
let searchQuery  = '';
let refreshTimer = null;
let deferredPrompt = null;

// ── PWA INSTALL ──────────────────────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('installDismissed')) {
    document.getElementById('install-banner').style.display = 'flex';
  }
});

document.getElementById('installBtn').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').style.display = 'none';
};

function dismissInstall() {
  localStorage.setItem('installDismissed', '1');
  document.getElementById('install-banner').style.display = 'none';
}

// ── SERVICE WORKER ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.warn);
}

// ── CSV PARSER ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split('\n');
  const result = [];
  let inQuote = false, row = [], cell = '';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    for (let j = 0; j < line.length; j++) {
      const ch = line[j];
      if (ch === '"') {
        inQuote = !inQuote;
      } else if (ch === ',' && !inQuote) {
        row.push(cell.trim());
        cell = '';
      } else {
        cell += ch;
      }
    }
    if (!inQuote) {
      row.push(cell.trim());
      cell = '';
      result.push(row);
      row = [];
    } else {
      cell += '\n';
    }
  }
  return result;
}

// ── DATA LOAD ─────────────────────────────────────────────────────────────────
async function loadData() {
  setStatus('loading', 'Actualizando...');
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');

  try {
    const resp = await fetch(CSV_URL + '&_=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    processData(parseCSV(text));
    setStatus('ok', `Actualizado a las ${new Date().toLocaleTimeString('es-CO', {hour:'2-digit',minute:'2-digit'})}`);
  } catch (err) {
    setStatus('error', 'Sin conexión – mostrando últimos datos');
    console.error(err);
  }

  btn.classList.remove('loading');
  scheduleRefresh();
  render();
}

function processData(rows) {
  allScheduled = [];
  allRegistry  = [];

  // Detect table 1 header
  const TABLE1_HEADERS = ['FECHA_ETA','HORA_ETA','CICLO','SVC','TIPO_SERVICIO','CATEGORIA',
    'DRIVER_ID','CÉDULA','NOMBRE','PLACA','STATION','OLA - RUTA'];
  // Detect table 2 header
  const TABLE2_HEADERS = ['Registro de Placas','Categoría','Celular','Station','Ola - Ruta'];

  let mode = null; // 'table1' | 'table2'
  let h1 = {}, h2 = {};

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const first = (row[0] || '').trim();

    // Detect header rows
    if (first === 'FECHA_ETA') {
      mode = 'table1';
      TABLE1_HEADERS.forEach((h, idx) => { h1[h] = idx; });
      continue;
    }
    if (first === 'Registro de Placas') {
      mode = 'table2';
      TABLE2_HEADERS.forEach((h, idx) => { h2[h] = idx; });
      continue;
    }

    if (!first || first === '') continue;

    if (mode === 'table1') {
      const placa = (row[h1['PLACA']] || '').trim().toUpperCase();
      if (!placa) continue;
      allScheduled.push({
        placa,
        hora:    (row[h1['HORA_ETA']]   || '').trim(),
        ciclo:   (row[h1['CICLO']]      || '').trim().toUpperCase(),
        svc:     (row[h1['SVC']]        || '').trim(),
        station: (row[h1['STATION']]    || '').trim().toUpperCase(),
        ola:     (row[h1['OLA - RUTA']] || '').trim(),
        tipo:    (row[h1['TIPO_SERVICIO']] || '').trim(),
        cat:     (row[h1['CATEGORIA']]  || '').trim(),
        nombre:  (row[h1['NOMBRE']]     || '').trim(),
      });
    }

    if (mode === 'table2') {
      const placa = (row[h2['Registro de Placas']] || '').trim().toUpperCase();
      if (!placa || placa === 'SIN DATOS') continue;
      allRegistry.push({
        placa,
        cat:     (row[h2['Categoría']]  || '').trim(),
        station: (row[h2['Station']]    || '').trim().toUpperCase(),
        ola:     (row[h2['Ola - Ruta']] || '').trim(),
      });
    }
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const q = searchQuery.toUpperCase().trim();
  const content = document.getElementById('content');

  if (q.length >= 2) {
    renderSearch(q, content);
    return;
  }

  if (currentTab === 'registro') {
    renderRegistry(content);
    return;
  }

  // Filter by ciclo tab
  let drivers = allScheduled;
  if (currentTab === 'AM') drivers = drivers.filter(d => d.ciclo === 'AM' || d.ciclo === 'AMT');
  if (currentTab === 'PM') drivers = drivers.filter(d => d.ciclo === 'PM');

  if (drivers.length === 0) {
    content.innerHTML = emptyState('Sin conductores', 'No hay conductores en este turno.');
    return;
  }

  // Group by ciclo then sort by hora
  const groups = {};
  drivers.forEach(d => {
    const key = d.ciclo || 'SIN CICLO';
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });

  let html = '';
  Object.keys(groups).sort().forEach(ciclo => {
    const list = groups[ciclo].sort((a, b) => a.hora.localeCompare(b.hora));
    html += `<div class="section-title">${ciclo} · ${list.length} conductores</div>`;
    list.forEach(d => { html += driverCard(d, ''); });
  });

  content.innerHTML = html;
}

function renderSearch(q, content) {
  // Search in both tables
  const inSched = allScheduled.filter(d => d.placa.includes(q));
  const inReg   = allRegistry.filter(d => d.placa.includes(q));

  if (inSched.length === 0 && inReg.length === 0) {
    content.innerHTML = `
      <div class="result-card not-found">
        <div style="font-size:40px;margin-bottom:8px">🔍</div>
        <p>Placa <strong>${q}</strong> no encontrada</p>
        <p style="font-size:12px;margin-top:6px">Verifica que esté en el archivo o intenta con otra</p>
      </div>`;
    return;
  }

  let html = '';

  // Show programmed drivers first (big cards)
  if (inSched.length > 0) {
    html += `<div class="section-title">Programados (${inSched.length})</div>`;
    inSched.forEach(d => {
      const stationClass = d.station === 'RESERVA' ? 'reserva' : '';
      html += `
      <div class="result-card">
        <div class="result-plate">${highlight(d.placa, q)}</div>
        <div class="result-grid">
          <div class="result-item">
            <div class="label">Muelle / Station</div>
            <div class="value">${d.station || '—'}</div>
          </div>
          <div class="result-item">
            <div class="label">Ola</div>
            <div class="value"><span class="ola-badge ${stationClass}">${d.ola || '—'}</span></div>
          </div>
          <div class="result-item">
            <div class="label">Hora ETA</div>
            <div class="value" style="font-size:16px">${d.hora || '—'}</div>
          </div>
          <div class="result-item">
            <div class="label">Ciclo</div>
            <div class="value" style="font-size:16px"><span class="ciclo-chip ${d.ciclo}">${d.ciclo}</span></div>
          </div>
          ${d.svc ? `<div class="result-item full"><div class="label">Servicio</div><div class="value" style="font-size:14px">${d.svc}</div></div>` : ''}
        </div>
      </div>`;
    });
  }

  // Show registry matches
  if (inReg.length > 0) {
    html += `<div class="section-title">Registro de placas (${inReg.length})</div>`;
    inReg.forEach(d => {
      html += `
      <div class="driver-card">
        <div>
          <div class="driver-plate">${highlight(d.placa, q)}</div>
          <div class="driver-meta"><span>${d.cat || '—'}</span></div>
        </div>
        <div class="driver-right">
          <div class="driver-station">${d.station || '—'}</div>
          <div class="driver-ola">Ola ${d.ola || '—'}</div>
        </div>
      </div>`;
    });
  }

  content.innerHTML = html;
}

function renderRegistry(content) {
  if (allRegistry.length === 0) {
    content.innerHTML = emptyState('Sin registros', 'No hay datos en el registro de placas.');
    return;
  }

  // Group by ola
  const groups = {};
  allRegistry.forEach(d => {
    const key = d.ola || 'Sin Ola';
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });

  let html = '';
  Object.keys(groups).sort().forEach(ola => {
    const list = groups[ola];
    html += `<div class="section-title">Ola ${ola} · ${list.length} placas</div>`;
    list.forEach(d => {
      html += `
      <div class="driver-card">
        <div>
          <div class="driver-plate">${d.placa}</div>
          <div class="driver-meta"><span>${d.cat || 'ANTIGUO'}</span></div>
        </div>
        <div class="driver-right">
          <div class="driver-station">${d.station || '—'}</div>
          <div class="driver-ola">Ola ${d.ola || '—'}</div>
        </div>
      </div>`;
    });
  });

  content.innerHTML = html;
}

function driverCard(d, q) {
  const plate = q ? highlight(d.placa, q) : d.placa;
  return `
  <div class="driver-card" onclick="searchByPlate('${d.placa}')">
    <div>
      <div class="driver-plate">${plate}</div>
      <div class="driver-meta">
        <span class="ciclo-chip ${d.ciclo}">${d.ciclo}</span>
        <span>${d.hora}</span>
        <span>${d.svc}</span>
      </div>
    </div>
    <div class="driver-right">
      <div class="driver-station">${d.station || '—'}</div>
      <div class="driver-ola">Ola ${d.ola || '—'}</div>
    </div>
  </div>`;
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function highlight(text, q) {
  if (!q) return text;
  return text.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
}

function emptyState(title, msg) {
  return `<div class="empty-state"><div class="emoji">📭</div><p><strong>${title}</strong><br>${msg}</p></div>`;
}

function setStatus(state, msg) {
  document.getElementById('statusDot').className = 'status-dot ' + state;
  document.getElementById('statusText').textContent = msg;
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  clearSearch();
  render();
}

function clearSearch() {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchWrap').classList.remove('has-text');
  render();
}

function searchByPlate(placa) {
  document.getElementById('searchInput').value = placa;
  searchQuery = placa;
  document.getElementById('searchWrap').classList.add('has-text');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.toUpperCase().trim();
  document.getElementById('searchWrap').classList.toggle('has-text', searchQuery.length > 0);
  render();
});

// ── AUTO REFRESH ──────────────────────────────────────────────────────────────
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(loadData, REFRESH_MS);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
