<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#3483FA"/>
  <title>Station Place – Sync</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#3483FA; min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:24px; color:white;
    }
    .emoji { font-size:64px; margin-bottom:16px; }
    h1 { font-size:24px; font-weight:800; margin-bottom:8px; }
    p  { font-size:15px; opacity:.85; text-align:center; line-height:1.5; margin-bottom:24px; }

    .auto-panel {
      background:rgba(255,255,255,.15); border-radius:16px; padding:20px;
      max-width:320px; width:100%; margin-bottom:20px; text-align:center;
    }
    .auto-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; opacity:.7; margin-bottom:8px; }
    .countdown { font-size:48px; font-weight:900; letter-spacing:-1px; line-height:1; margin-bottom:4px; }
    .countdown-sub { font-size:13px; opacity:.75; }
    .progress-bar {
      width:100%; height:6px; background:rgba(255,255,255,.2); border-radius:3px; margin-top:14px; overflow:hidden;
    }
    .progress-fill {
      height:100%; background:white; border-radius:3px; transition:width 1s linear;
    }

    .toggle-wrap { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:20px; }
    .toggle-label { font-size:15px; font-weight:700; }
    .toggle {
      position:relative; width:52px; height:28px; background:rgba(255,255,255,.3);
      border-radius:14px; cursor:pointer; transition:background .3s; border:none;
    }
    .toggle.on { background:rgba(0,200,100,.8); }
    .toggle::after {
      content:''; position:absolute; top:4px; left:4px;
      width:20px; height:20px; background:white; border-radius:50%;
      transition:left .3s;
    }
    .toggle.on::after { left:28px; }

    .btn {
      width:100%; max-width:320px; padding:16px; border:none; border-radius:14px;
      font-size:16px; font-weight:800; cursor:pointer; transition:transform .1s;
      margin-bottom:10px;
    }
    .btn:active { transform:scale(.97); }
    .btn-primary   { background:white; color:#3483FA; }
    .btn-secondary { background:rgba(255,255,255,.15); color:white; font-size:13px; padding:12px; }

    .status {
      margin-top:16px; padding:14px 18px; background:rgba(255,255,255,.15);
      border-radius:12px; font-size:14px; text-align:center; line-height:1.6;
      max-width:320px; width:100%; display:none; white-space:pre-line;
    }
    .status.show    { display:block; }
    .status.success { background:rgba(0,166,80,.35); }
    .status.error   { background:rgba(242,61,79,.35); }

    .setup-box {
      background:rgba(255,255,255,.1); border-radius:14px; padding:20px;
      max-width:320px; width:100%; margin-top:12px;
    }
    .setup-box label { font-size:13px; opacity:.85; display:block; margin-bottom:8px; }
    .setup-box input {
      width:100%; padding:12px; border-radius:8px; border:2px solid rgba(255,255,255,.3);
      background:rgba(255,255,255,.1); color:white; font-size:14px; font-family:monospace; outline:none;
    }
    .setup-box input::placeholder { opacity:.5; }
    .setup-box input:focus { border-color:white; }

    .log { max-width:320px; width:100%; margin-top:12px; font-size:12px; opacity:.65; text-align:center; }

    .back-link { margin-top:24px; font-size:13px; opacity:.7; text-decoration:none; color:white; }

    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner { display:inline-block; animation:spin 1s linear infinite; }
  </style>
</head>
<body>

<div class="emoji" id="icon">🔄</div>
<h1>Sincronización</h1>
<p>Mantén esta página abierta para sincronizar automáticamente cada 5 minutos</p>

<!-- AUTO COUNTDOWN -->
<div class="auto-panel" id="autoPanel">
  <div class="auto-label">Próxima sincronización en</div>
  <div class="countdown" id="countdown">5:00</div>
  <div class="countdown-sub" id="countdownSub">Auto-sync activo</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:100%"></div></div>
</div>

<!-- AUTO TOGGLE -->
<div class="toggle-wrap">
  <span class="toggle-label">Auto-sync (5 min)</span>
  <button class="toggle on" id="toggleBtn" onclick="toggleAuto()"></button>
</div>

<button class="btn btn-primary" id="syncBtn" onclick="doSync()">⚡ Sincronizar ahora</button>
<button class="btn btn-secondary" id="settingsBtn" onclick="showSettings()">⚙️ Configurar token</button>

<div class="status" id="status"></div>

<div class="setup-box" id="setupBox" style="display:none">
  <label>Token de GitHub (se guarda en tu celular):</label>
  <input type="password" id="tokenInput" placeholder="ghp_..." autocomplete="off" spellcheck="false"/>
  <br><br>
  <button class="btn btn-primary" onclick="saveToken()" style="font-size:15px;padding:14px">
    Guardar token
  </button>
</div>

<div class="log" id="logLine"></div>

<a class="back-link" href="./index.html">← Volver a la app</a>

<script>
const GH_OWNER = 'jaiderhernandezME';
const GH_REPO  = 'final-station';
const WORKFLOW  = 'update-data.yml';
const AUTO_INTERVAL = 5 * 60; // seconds

let autoEnabled  = true;
let secondsLeft  = AUTO_INTERVAL;
let tickTimer    = null;
let syncing      = false;

// ── TOKEN ────────────────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('gh_sync_token') || ''; }

function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t.startsWith('ghp_') && !t.startsWith('github_pat_')) {
    showStatus('Token invalido. Debe empezar con ghp_ o github_pat_', 'error');
    return;
  }
  localStorage.setItem('gh_sync_token', t);
  document.getElementById('setupBox').style.display = 'none';
  showStatus('Token guardado. Ya puedes sincronizar.', 'success');
}

function showSettings() {
  const box = document.getElementById('setupBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  document.getElementById('tokenInput').value = getToken();
}

// ── SYNC ─────────────────────────────────────────────────────────────────────
async function doSync(auto = false) {
  const token = getToken();
  if (!token) {
    showStatus('Primero configura el token. Toca Configurar token.', 'error');
    document.getElementById('setupBox').style.display = 'block';
    return;
  }
  if (syncing) return;
  syncing = true;

  if (!auto) {
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner">🔄</span> Sincronizando...';
  }

  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${WORKFLOW}/dispatches`,
      {
        method: 'POST',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ ref: 'main' })
      }
    );

    const now = new Date().toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
    if (resp.status === 204) {
      const msg = auto ? `Auto-sync OK a las ${now}` : `Sincronizacion iniciada a las ${now}`;
      if (!auto) showStatus(`Sincronizacion iniciada.\n\nEspera 25-30 seg, vuelve a la app y toca Actualizar.`, 'success');
      setLog(`Ultima sync: ${now}`);
      document.getElementById('icon').textContent = '✅';
    } else if (resp.status === 401) {
      showStatus('Token invalido o expirado. Actualiza el token.', 'error');
    } else {
      const text = await resp.text();
      showStatus(`Error ${resp.status}`, 'error');
    }
  } catch(e) {
    showStatus('Sin conexion. Verifica internet.', 'error');
  }

  syncing = false;
  if (!auto) {
    const btn = document.getElementById('syncBtn');
    btn.disabled = false;
    btn.innerHTML = 'Sincronizar ahora';
  }
}

// ── AUTO-SYNC TICK ────────────────────────────────────────────────────────────
function startTick() {
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    if (!autoEnabled) return;
    secondsLeft--;
    updateCountdownUI();
    if (secondsLeft <= 0) {
      secondsLeft = AUTO_INTERVAL;
      doSync(true);
    }
  }, 1000);
}

function updateCountdownUI() {
  const m = Math.floor(secondsLeft / 60);
  const s = secondsLeft % 60;
  document.getElementById('countdown').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const pct = (secondsLeft / AUTO_INTERVAL) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

function toggleAuto() {
  autoEnabled = !autoEnabled;
  const btn = document.getElementById('toggleBtn');
  btn.classList.toggle('on', autoEnabled);
  document.getElementById('countdownSub').textContent = autoEnabled ? 'Auto-sync activo' : 'Auto-sync pausado';
  if (autoEnabled) { secondsLeft = AUTO_INTERVAL; updateCountdownUI(); }
}

function setLog(msg) { document.getElementById('logLine').textContent = msg; }

// ── STATUS ────────────────────────────────────────────────────────────────────
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status show ' + type;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  if (!getToken()) {
    showStatus('Configura el token para sincronizar.', '');
    document.getElementById('setupBox').style.display = 'block';
  }
  updateCountdownUI();
  startTick();
  // First sync immediately on load if token exists
  if (getToken()) {
    setTimeout(() => doSync(true), 2000);
  }
});

// Pause auto-sync when tab is hidden (battery saving), resume when visible
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(tickTimer);
  } else {
    startTick();
  }
});
</script>
</body>
</html>
